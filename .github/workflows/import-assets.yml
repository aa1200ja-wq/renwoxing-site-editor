name: Import Renwoxing Assets

on:
  push:
    paths:
      - ".github/workflows/import-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download uploaded ZIP
        run: curl -L --fail --retry 3 "https://at.adobe.com/XF2A3arwrep0mXVs" -o /tmp/renwoxing-assets.zip

      - name: Extract and optimize website assets
        run: |
          python - <<'PY'
          import io
          import os
          import zipfile
          from PIL import Image

          targets = [
              "zhenru-01.webp", "zhenru-02.webp",
              "member-a-01.webp", "member-a-02.webp",
              "member-b-01.webp", "member-b-02.webp",
              "member-c-01.webp", "member-c-02.webp",
              "member-d-01.webp", "member-d-02.webp",
              "member-e-01.webp", "member-e-02.webp",
              "member-f-01.webp", "member-f-02.webp",
              "member-g-01.webp", "member-g-02.webp",
              "leader-01.webp", "leader-02.webp",
              "instructor-01.webp", "instructor-02.webp",
              "activity-01.webp", "activity-02.webp", "activity-03.webp",
          ]

          out_dir = "public/assets/renwoxing"
          os.makedirs(out_dir, exist_ok=True)

          with zipfile.ZipFile("/tmp/renwoxing-assets.zip") as archive:
              entries = [
                  name for name in archive.namelist()
                  if name.lower().endswith(".png")
              ]
              if len(entries) != len(targets):
                  raise RuntimeError(
                      f"Expected {len(targets)} PNG files, found {len(entries)}"
                  )

              for index, (source, target) in enumerate(zip(entries, targets)):
                  image = Image.open(io.BytesIO(archive.read(source))).convert("RGB")
                  max_width = 1400 if index >= 20 else 760
                  if image.width > max_width:
                      ratio = max_width / image.width
                      image = image.resize(
                          (max_width, round(image.height * ratio)),
                          Image.Resampling.LANCZOS,
                      )
                  image.save(
                      os.path.join(out_dir, target),
                      "WEBP",
                      quality=84,
                      method=6,
                  )
                  print(source, "->", target, image.size)
          PY

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/renwoxing
          git commit -m "assets: import renwoxing member and event photos"
          git push
