name: Import Vinyl Assets

on:
  push:
    paths:
      - ".github/workflows/import-vinyl-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download source assets
        run: |
          curl -L --fail --retry 3 "https://at.adobe.com/524OLcQlkQ2Wz7hV" -o /tmp/vinyl-disc.png
          curl -L --fail --retry 3 "https://at.adobe.com/0R1ZhuEeMW83E7gy" -o /tmp/label-gold.png
          curl -L --fail --retry 3 "https://at.adobe.com/XAlzKvLK2ngRlahY" -o /tmp/saxophone.png

      - name: Optimize assets
        run: |
          python - <<'PY'
          from PIL import Image
          assets = [
              ("/tmp/vinyl-disc.png", "public/assets/renwoxing/vinyl-disc.webp"),
              ("/tmp/label-gold.png", "public/assets/renwoxing/label-gold.webp"),
              ("/tmp/saxophone.png", "public/assets/renwoxing/saxophone.webp"),
          ]
          for source, target in assets:
              image = Image.open(source).convert("RGBA")
              image.save(target, "WEBP", quality=88, method=6)
              print(target, image.size)
          PY

      - name: Commit local vinyl assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/renwoxing/vinyl-disc.webp
          git add public/assets/renwoxing/label-gold.webp
          git add public/assets/renwoxing/saxophone.webp
          git commit -m "assets: add local vinyl artwork"
          git push
