name: Cloudflare build test

on:
  push:
    branches:
      - deploy/cloudflare-workers-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build for Cloudflare Workers
        run: npm run build:cloudflare
