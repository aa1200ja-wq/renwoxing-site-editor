name: Import Album Spread

on:
  push:
    paths:
      - ".github/workflows/import-album-spread.yml"

permissions:
  contents: write

jobs:
  import-album:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download album spread
        run: curl -L --fail --retry 3 "https://at.adobe.com/PG2NYLtKqhnkBv0E" -o /tmp/album-spread.png

      - name: Optimize asset
        run: |
          python - <<'PY'
          from PIL import Image
          image = Image.open("/tmp/album-spread.png").convert("RGB")
          image.save(
              "public/assets/renwoxing/album-spread.webp",
              "WEBP",
              quality=86,
              method=6,
          )
          print(image.size)
          PY

      - name: Commit optimized asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/renwoxing/album-spread.webp
          git commit -m "assets: add album spread background"
          git push
